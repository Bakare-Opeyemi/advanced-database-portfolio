
# ---- MoniWallet replication lab: REPLICA (appended to postgresql.conf) ----
# pg_basebackup -R already wrote primary_conninfo and standby.signal
listen_addresses = '127.0.0.1'
hot_standby = on                     # allow read-only queries while replaying WAL
primary_slot_name = 'replica1_slot'
hot_standby_feedback = on            # stop the primary removing rows a long replica query still needs
