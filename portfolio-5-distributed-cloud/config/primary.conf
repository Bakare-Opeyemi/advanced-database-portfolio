
# ---- OpeLat Wallet replication lab: PRIMARY (appended to postgresql.conf) ----
listen_addresses = '127.0.0.1'
wal_level = replica                  # write enough WAL for a standby to replay
max_wal_senders = 5                  # how many replicas can stream at once
max_replication_slots = 5            # a slot keeps WAL until the replica has it
synchronous_standby_names = ''       # start asynchronous; the demo switches it to 'replica1'
synchronous_commit = on
wal_sender_timeout = 10s
